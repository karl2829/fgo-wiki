<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:34px;background:#0A1018;font-family:"WenQuanYi Zen Hei",sans-serif}
.row{display:flex;gap:26px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:300px}
.card{width:300px;height:390px;padding:1.5px;border-radius:20px;position:relative}
.inner{width:100%;height:100%;border-radius:18.5px;
  background:linear-gradient(180deg,#17243D 0%,#131E33 46%,#0C1524 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gold{background:linear-gradient(128deg,#6E5620 0%,#C9A227 9%,#F8EDCB 19%,#E8C877 31%,#A8862F 47%,#C9A227 63%,#F5E3AE 79%,#8A6E1A 93%,#C9A227 100%);
  box-shadow:0 0 0 1px rgba(227,195,107,.22),0 0 18px rgba(227,195,107,.30),0 0 56px rgba(227,195,107,.16),0 22px 60px rgba(0,0,0,.6)}
.silver{background:linear-gradient(128deg,#5A6570 0%,#AEB8C2 9%,#F2F6FA 19%,#C7D0D9 31%,#7C8792 47%,#AEB8C2 63%,#EAF0F5 79%,#606B76 93%,#AEB8C2 100%);
  box-shadow:0 0 0 1px rgba(206,218,230,.18),0 0 18px rgba(186,202,218,.24),0 0 56px rgba(150,170,196,.13),0 22px 60px rgba(0,0,0,.6)}
.copper{background:linear-gradient(128deg,#4E3718 0%,#9C7440 9%,#F0D2A8 19%,#BE8F52 31%,#8A6234 47%,#9C7440 63%,#E8C79A 79%,#5E4522 93%,#9C7440 100%);
  box-shadow:0 0 0 1px rgba(206,170,120,.16),0 0 18px rgba(188,144,88,.22),0 0 56px rgba(160,120,70,.12),0 22px 60px rgba(0,0,0,.6)}
.corner{position:absolute;width:26px;height:26px;opacity:.8}
.tl{left:12px;top:12px;border-left:1.5px solid #E3C36B;border-top:1.5px solid #E3C36B;border-radius:3px 0 0 0}
.br{right:12px;bottom:12px;border-right:1.5px solid #E3C36B;border-bottom:1.5px solid #E3C36B;border-radius:0 0 3px 0}
.lb{font-size:19px;color:#F2EDE3}
.lb2{font-size:14px;color:#8B98AE;margin-top:6px;text-align:center;line-height:1.6}
.nm{font-size:15px;color:#C9A227;letter-spacing:.16em}
</style></head><body>
<div class="row">
  <div class="wrap">
    <div class="card gold"><div class="inner">
      <div class="corner tl"></div><div class="corner br"></div>
      <div style="text-align:center"><div class="lb">★5 / ★4</div><div class="lb2">金　GOLD</div></div>
    </div></div>
    <div class="nm">4–5 星</div>
  </div>
  <div class="wrap">
    <div class="card silver"><div class="inner">
      <div class="corner tl"></div><div class="corner br"></div>
      <div style="text-align:center"><div class="lb">★3</div><div class="lb2">银　SILVER</div></div>
    </div></div>
    <div class="nm">3 星</div>
  </div>
  <div class="wrap">
    <div class="card copper"><div class="inner">
      <div class="corner tl"></div><div class="corner br"></div>
      <div style="text-align:center"><div class="lb">★1 / ★2</div><div class="lb2">铜　BRONZE</div></div>
    </div></div>
    <div class="nm">1–2 星</div>
  </div>
</div>
</body></html>
